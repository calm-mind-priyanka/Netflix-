<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYRA Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><main class="admin"><header><b>VYRA CONTROL</b><button id="logout">Logout</button></header><section id="login"><h1>Admin access</h1><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button id="loginBtn">Sign in</button><p id="loginMsg"></p></section><section id="panel" class="hidden"><div class="grid"><article><h2>Website</h2><label><input id="maintenance" type="checkbox"> Maintenance mode</label><button id="saveMaintenance">Save</button></article><article><h2>Verification</h2><p class="muted">Website verification runs in the browser; Telegram is not required.</p><label><input id="verifyEnabled" type="checkbox"> Verification enabled</label><div class="cols"><label><input id="s1on" type="checkbox">1st ON</label><input id="s1name" placeholder="1st shortener"><input id="s1api" placeholder="1st API"><label><input id="s2on" type="checkbox">2nd ON</label><input id="s2name" placeholder="2nd shortener"><input id="s2api" placeholder="2nd API"><label><input id="s3on" type="checkbox">3rd ON</label><input id="s3name" placeholder="3rd shortener"><input id="s3api" placeholder="3rd API"></div><div class="cols"><input id="t1" placeholder="Tutorial 1 URL"><input id="t2" placeholder="Tutorial 2 URL"><input id="t3" placeholder="Tutorial 3 URL"></div><div class="cols"><input id="v2" type="number" placeholder="Stage 2 after seconds"><input id="v3" type="number" placeholder="Stage 3 after seconds"><input id="validity" type="number" min="1" max="720" placeholder="Verification validity (hours)"></div><button id="saveVerify">Save verification</button></article><article><h2>Premium & Payments</h2><p>Plans and Razorpay/manual settings remain environment driven. Use Mongo-backed website collections; media remains read-only.</p><button id="refresh">Refresh</button></article></div><pre id="state"></pre></section></main><script src="/admin/admin.js"></script></body></html>
