<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYRA Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><main class="admin"><header><b>VYRA CONTROL</b><button id="logout">Logout</button></header><section id="panel" class="hidden"><div class="grid"><article><h2>Website</h2><label><input id="maintenance" type="checkbox"> Maintenance mode</label><button id="saveMaintenance">Save</button></article><article><h2>AutoFilter Search</h2><label>Maximum title results <input id="maxResults" type="number" min="1" max="200"></label><label>Files per page <input id="resultsPerPage" type="number" min="10" max="50"></label><label>Candidate scan <input id="candidateLimit" type="number" min="20" max="500"></label><label><input id="spellCheck" type="checkbox"> AI spelling correction</label><label><input id="fuzzy" type="checkbox"> Fuzzy fallback</label><label><input id="imdb" type="checkbox"> IMDb poster/correction</label><button id="saveSearch">Save search</button></article><article><h2>Verification</h2><label><input id="verifyEnabled" type="checkbox"> Verification enabled</label><label><input id="shortlinkEnabled" type="checkbox"> Shortlinks enabled</label><div class="cols"><label><input id="s1on" type="checkbox">1st ON</label><input id="s1name" placeholder="1st shortener"><input id="s1api" placeholder="1st API"><label><input id="s2on" type="checkbox">2nd ON</label><input id="s2name" placeholder="2nd shortener"><input id="s2api" placeholder="2nd API"><label><input id="s3on" type="checkbox">3rd ON</label><input id="s3name" placeholder="3rd shortener"><input id="s3api" placeholder="3rd API"></div><div class="cols"><input id="t1" placeholder="Tutorial 1 URL"><input id="t2" placeholder="Tutorial 2 URL"><input id="t3" placeholder="Tutorial 3 URL"></div><div class="cols"><input id="v2" type="number" placeholder="Stage 2 after seconds"><input id="v3" type="number" placeholder="Stage 3 after seconds"><input id="validity" type="number" min="1" max="720" placeholder="Validity hours"></div><button id="saveVerify">Save verification</button></article><article><h2>Files & Metadata</h2><label><input id="fileSecure" type="checkbox"> Protect file access</label><label><input id="autoDelete" type="checkbox"> Auto-delete/expiry control</label><label>Auto-delete seconds <input id="autoDeleteSeconds" type="number" min="1" max="86400"></label><label><input id="tmdbEnabled" type="checkbox"> TMDB metadata</label><label><input id="posterFallback" type="checkbox"> Poster fallback</label><button id="saveFiles">Save files</button></article><article><h2>Premium & Payments</h2><label>Activation mode <select id="activationMode"><option value="environment">Environment setting</option><option value="auto">Automatic payment only</option><option value="manual">Manual proof only</option></select></label><label><input id="premiumBypass" type="checkbox"> Premium bypasses verification</label><button id="savePayments">Save payment/access settings</button><p class="muted">Plans/prices remain environment driven. Pending manual payments are listed below.</p><div id="manualRequests"></div><button id="refresh">Refresh</button></article></div><pre id="state"></pre></section></main><script src="/admin/admin.js"></script></body></html>
